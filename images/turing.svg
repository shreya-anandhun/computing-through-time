<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" font-family="'Google Sans Flex','Google Sans',Roboto,system-ui,sans-serif">
  <!-- Original illustration: a Turing machine tape and reading head -->
  <rect width="640" height="800" fill="#f4f4f4"/>

  <!-- faint grid, like squared paper -->
  <g stroke="#000" stroke-opacity=".06" stroke-width="1">
    <path d="M0 100H640M0 200H640M0 300H640M0 400H640M0 500H640M0 600H640M0 700H640"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800"/>
  </g>

  <!-- the reading head -->
  <g transform="translate(320 300)">
    <path d="M-70 -150h140a16 16 0 0 1 16 16v70a16 16 0 0 1-16 16H-70a16 16 0 0 1-16-16v-70a16 16 0 0 1 16-16z" fill="#000"/>
    <path d="M-20 -48h40l-20 34z" fill="#000"/>
    <text x="0" y="-100" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">READ</text>
    <circle cx="0" cy="-130" r="6" fill="#7c0a02"/>
    <circle cx="-44" cy="-130" r="6" fill="#fff" opacity=".4"/>
    <circle cx="44" cy="-130" r="6" fill="#fff" opacity=".4"/>
  </g>

  <!-- the tape, curving off both edges -->
  <path d="M-40 420 Q 80 380 240 400 T 680 400" fill="none" stroke="#000" stroke-width="4"/>
  <path d="M-40 520 Q 80 480 240 500 T 680 500" fill="none" stroke="#000" stroke-width="4"/>

  <!-- cells on the tape -->
  <g font-size="44" font-weight="700" text-anchor="middle">
    <rect x="40" y="406" width="90" height="94" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="85" y="470" fill="#000">1</text>
    <rect x="140" y="402" width="90" height="98" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="185" y="468" fill="#000">0</text>
    <rect x="240" y="400" width="90" height="100" rx="14" fill="#7c0a02" stroke="#7c0a02" stroke-width="3"/>
    <text x="285" y="468" fill="#fff">1</text>
    <rect x="340" y="400" width="90" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="385" y="468" fill="#000">1</text>
    <rect x="440" y="402" width="90" height="98" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="485" y="468" fill="#000">0</text>
    <rect x="540" y="406" width="90" height="94" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="585" y="470" fill="#000">0</text>
  </g>

  <!-- the head sits over the red cell -->
  <path d="M285 322v70" stroke="#7c0a02" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- instruction table, bottom -->
  <g transform="translate(80 580)" font-size="22" fill="#000">
    <rect x="0" y="0" width="480" height="150" rx="20" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="30" y="46" font-weight="700">state</text>
    <text x="150" y="46" font-weight="700">read</text>
    <text x="250" y="46" font-weight="700">write</text>
    <text x="350" y="46" font-weight="700">move</text>
    <path d="M20 62h440" stroke="#000" stroke-opacity=".2" stroke-width="2"/>
    <text x="30" y="98">A</text><text x="150" y="98">1</text><text x="250" y="98" fill="#7c0a02" font-weight="700">0</text><text x="350" y="98">→</text>
    <text x="30" y="132">A</text><text x="150" y="132">0</text><text x="250" y="132">1</text><text x="350" y="132">←</text>
  </g>

  <text x="320" y="770" text-anchor="middle" font-size="20" fill="#000" fill-opacity=".55">a universal machine, 1936</text>
</svg>
